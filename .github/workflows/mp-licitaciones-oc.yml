name: MP · Licitaciones (cada 1h)

on:
  schedule:
    # Cada hora, minuto 15 (UTC). A 2 h el barrido no alcanzaba a dar una vuelta
    # completa a las ~4.000 activas y la cola de la lista quedaba sin visitar.
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: mp-licitaciones-oc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mp_sync
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TICKET_ACTIVAS:       ${{ secrets.TICKET_ACTIVAS }}
      CURSOR_BACKEND:       supabase
      SLEEP_BETWEEN:        "2.0"
      # 400 × ~2,5 s ≈ 17 min, holgado contra el timeout de 40.
      # 24 corridas × 400 = 9.600 posiciones/día ≈ 2 vueltas completas.
      LIC_MAX_POR_RUN:      "400"
      # Cupo de la ventana reservado a licitaciones que aún no están en BD.
      # Vacío = toda la ventana si hace falta (útil para drenar el atraso).
      LIC_MAX_NUEVAS:       "400"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Licitaciones activas
        run: python sync_activas.py
