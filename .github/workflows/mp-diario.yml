name: MP · Estados + CRM (diario)

# Los crones son UTC. Chile alterna UTC-3 (sept-abril) y UTC-4 (abril-sept),
# asi que la hora local se corre una hora dos veces al año. Las horas de los
# comentarios son en UTC-3; en invierno resta una hora.

on:
  schedule:
    - cron: "30 9 * * *"         # 06:30 Chile (UTC-3). Con el techo de 90 min
                             # termina 08:00 a más tardar: es el último job
                             # antes de la jornada y no puede pisarla.
  workflow_dispatch:

concurrency:
  group: mp-diario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mp_sync
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TICKET_ACTIVAS:       ${{ secrets.TICKET_ACTIVAS }}
      TICKET_CRM:           ${{ secrets.TICKET_CRM }}
      CURSOR_BACKEND:       supabase
      SLEEP_BETWEEN:        "2.0"
      ESTADOS_DIAS_ATRAS:   "2"
      CRM_LIMIT:            "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estados diario (adjudicadas/desiertas/etc)
        run: python sync_estados_diario.py
      - name: CRM
        run: python sync_crm.py
