name: Odoo → Supabase FULL resync (1x/día L-V)

on:
  # Disparado por pg_cron en Supabase (job 'dispatch-mp-odoo-full') vía workflow_dispatch.
  # Para la primera limpieza de líneas fantasma de account_move_lines, correr a mano
  # desde Actions con aml_ghost_days = 0 (recorre todo el espejo, ~143 k asientos).
  workflow_dispatch:
    inputs:
      aml_ghost_days:
        description: "Días hacia atrás del backfill de líneas fantasma (0 = todo el espejo)"
        required: false
        default: "120"

concurrency:
  group: odoo-sync            # mismo grupo que el job de 20 min → nunca corren a la vez
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: odoo_sync
    env:
      RUN_ONCE:                  "1"
      FORCE_FULL_RESYNC:         "1"   # corre stock/purchase/account_moves FULL + archivado, 1 vez
      AML_GHOST_DAYS:            ${{ inputs.aml_ghost_days || '120' }}   # backfill fantasmas account_move_lines
      TZ_LOCAL:                  "America/Santiago"
      WORK_START_HOUR:           "7"
      WORK_END_HOUR:             "19"
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
      ODOO_JSONRPC:              ${{ secrets.ODOO_JSONRPC }}
      ODOO_DB:                   ${{ secrets.ODOO_DB }}
      ODOO_USER:                 ${{ secrets.ODOO_USER }}
      ODOO_API_KEY:              ${{ secrets.ODOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_odoo_supabase.py
