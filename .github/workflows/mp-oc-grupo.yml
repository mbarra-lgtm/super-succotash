name: MP · OC del grupo por proveedor (cada 6h)

# Separado de mp-oc-backfill-proveedor.yml a proposito: ese barre los 59 RUTs de
# mp_competidores con un presupuesto compartido y sin orden garantizado, asi que
# los 3 RUTs del grupo pueden quedar sin cuota detras de la inteligencia
# competitiva. Nuestras propias OC son dato operativo, no analitica: van aparte,
# mas seguido y con presupuesto propio.

# Los crones son UTC. Chile alterna UTC-3 (sept-abril) y UTC-4 (abril-sept),
# asi que la hora local se corre una hora dos veces al año. Las horas de los
# comentarios son en UTC-3; en invierno resta una hora.

on:
  schedule:
    # Antes "20 */6": dos de las cuatro corridas caían en plena jornada.
    # Mismas 4 corridas, todas de noche, en los huecos que deja el barrido
    # (que ocupa de :40 a :05 de cada hora).
    - cron: "10 23,1,3,5 * * *"   # 20:10, 22:10, 00:10 y 02:10 Chile
  workflow_dispatch:

concurrency:
  # Carril propio A PROPOSITO, no mp-pesado. Este job existe justamente para que
  # las OC del grupo no queden detras de la inteligencia competitiva; meterlo en
  # la cola compartida con el backfill de 59 RUTs lo dejaria cancelandose contra
  # el, que es el problema que vino a resolver. Son 3 RUTs: no pesa.
  group: mp-oc-grupo
  cancel-in-progress: false

jobs:
  grupo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mp_sync
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TICKET_OC:            ${{ secrets.TICKET_OC }}
      SLEEP_BETWEEN_OC:     "2.0"
      OC_PROV_MAX_DET:      "400"
      OC_BACKFILL_RUTS:     "87.927.900-3,77.712.689-K,76.708.952-K"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backfill_oc_por_proveedor.py
