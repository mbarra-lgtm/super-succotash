name: MP · Adjuntos (listar, nocturno)

# Lista la METADATA de los anexos de las licitaciones priorizadas (las que
# pegan con el Core de alguien, las marcadas interesa/quizás, y la cola manual
# del panel). No descarga archivos: eso lo hace la Edge Function
# mp-obtener-adjunto cuando alguien clickea un documento.
#
# 16-09-2026 — pasó de cada 2 h a una corrida nocturna. Casi nadie lee estos
# datos de forma directa (6 GET en 24 h), pero NO se apagó porque cinco vistas
# dependen de estas tablas:
#
#   v_mp_adjuntos_pendientes        v_mp_seguimiento_panel
#   v_mp_desenlace_panel            v_mp_seguimiento_no_adjudicadas
#   v_mp_resoluciones_pendientes    ← es la cola del worker de Resoluciones
#
# Apagarlo del todo no rompe esas vistas, pero las deja sin anexos nuevos y al
# worker de resoluciones sin trabajo. Una corrida nocturna cuesta casi lo mismo
# que apagarlo y las mantiene alimentadas.
#
# Dimensionamiento: la cola manual está en 0 pendientes y hay ~900 licitaciones
# ya procesadas (447 con anexos, 458 sin). Las 12 corridas diarias de 80 estaban
# en su mayoría girando en vacío; 300 en una sola pasada sobra.

on:
  schedule:
    # 04:10 Chile. Los jobs del grupo mp-pesado terminan ~04:05 y el de OC Datos
    # Abiertos arranca 05:00: esta es la ventana tranquila de la madrugada.
    - cron: "10 7 * * *"
  workflow_dispatch:           # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: mp-adjuntos
  cancel-in-progress: false

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mp_sync
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 300 × 2 requests × 2 s ≈ 20 min, holgado contra el timeout de 30.
      ADJ_MAX_LIC_POR_RUN:  "300"    # listar es barato: 2 requests por licitación
      SLEEP_BETWEEN:        "2.0"    # la ficha de MP tira 429 igual que la API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sync_adjuntos.py
