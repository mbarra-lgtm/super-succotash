name: CORE · Radar comercial

on:
  schedule:
    - cron: "0 11 * * 1-5"     # 11:00 UTC ≈ 07:00 Chile
    - cron: "0 23 * * 1-5"     # 23:00 UTC ≈ 19:00 Chile
  workflow_dispatch:
    inputs:
      slug:
        description: "Procesar solo esta fuente (ej: gore-biobio-acuerdos)"
        required: false
      dry_run:
        description: "No escribir en Supabase"
        type: boolean
        default: false

concurrency:
  group: core-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core_sync
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      RADAR_MODELO:         claude-sonnet-4-5
      CORE_MAX_POR_CORRIDA: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # Atacama y O'Higgins publican PDFs escaneados (17 chars/página).
      # Sin OCR esas regiones nunca producen una señal.
      - name: OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ocrmypdf tesseract-ocr-spa

      - name: Descubrir y bajar actas CORE
        run: |
          python scrape_core.py \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Clasificar señales de actas
        if: ${{ !inputs.dry_run }}
        run: python clasificar_senales.py

      # La prensa va aparte: filtro invertido (el diccionario negativo pesa más
      # que el positivo) y clasificación en lote, porque una nota son ~300
      # caracteres y no justifica una llamada por pieza.
      - name: Prensa (RSS)
        if: ${{ !inputs.slug }}
        run: |
          python ingesta_prensa.py ${{ inputs.dry_run && '--dry-run' || '' }}
